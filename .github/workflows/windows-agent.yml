name: Build Windows boxulaAgent (Agent2)

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build-windows-agent2:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build tools (MinGW + Go + CMake)
        run: |
          choco install -y mingw
          choco install -y golang
          choco install -y cmake

      - name: Clone and bootstrap vcpkg
        run: |
          cd C:\
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat

      # Cacht C:\zabbix_deps, damit vcpkg nicht jedes Mal 20 Minuten baut
      - name: Cache vcpkg deps
        uses: actions/cache@v4
        with:
          path: |
            C:\zabbix_deps
          key: zabbix-vcpkg-v1-${{ runner.os }}-x64-mingw-static

      - name: Install Zabbix dependencies via vcpkg
        run: |
          cd C:\vcpkg
          .\vcpkg.exe install ^
            pcre2:x64-mingw-static ^
            libiconv:x64-mingw-static ^
            openssl:x64-mingw-static ^
            --x-install-root=C:\zabbix_deps

      - name: Build Zabbix Agent2 (boxula fork)
        env:
          CGO_LDFLAGS: "-lCrypt32"
          GOFLAGS: "-buildvcs=false"
        run: |
          # MinGW + Go in PATH
          $mingw = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          $go    = "C:\Program Files\Go\bin"
          $env:PATH = "$mingw;$go;$env:PATH"

          # vcpkg-Triplet-Pfad (wichtig: kein "installed" im Pfad!)
          $env:VCROOT = "C:\zabbix_deps\x64-mingw-static"

          cd $Env:GITHUB_WORKSPACE\build\mingw

          mingw32-make ARCH=AMD64 PCRE2=$env:VCROOT OPENSSL=$env:VCROOT all

      - name: Upload built agent2
        uses: actions/upload-artifact@v4
        with:
          name: boxula-agent2-win64
          path: bin\win64\zabbix_agent2.exe
