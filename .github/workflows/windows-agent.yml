name: Build Windows boxulaAgent (Agent2)

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build-windows-agent2:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build tools (MinGW + Go + CMake)
        run: |
          choco install -y mingw
          choco install -y golang
          choco install -y cmake

      - name: Clone and bootstrap vcpkg
        run: |
          cd C:\
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat

      - name: Install Zabbix dependencies via vcpkg
        run: |
          cd C:\vcpkg
          .\vcpkg.exe install pcre2:x64-mingw-static libiconv:x64-mingw-static openssl:x64-mingw-static --x-install-root=C:\zabbix_deps

      - name: Build Zabbix Agent2 (boxula fork)
        env:
          CGO_LDFLAGS: "-lCrypt32"
          GOFLAGS: "-buildvcs=false"
        run: |
          # Pfade für MinGW und Go setzen
          $mingw = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          $go    = "C:\Program Files\Go\bin"
          $env:PATH = "$mingw;$go;$env:PATH"

          # vcpkg Triplet-Pfad
          $env:VCROOT = "C:\zabbix_deps\installed\x64-mingw-static"

          # In den MinGW-Build-Ordner wechseln
          cd $Env:GITHUB_WORKSPACE\build\mingw

          # Build starten
          mingw32-make ARCH=AMD64 PCRE2=$env:VCROOT OPENSSL=$env:VCROOT all

      - name: Upload built agent2
        uses: actions/upload-artifact@v4
        with:
          name: boxula-agent2-win64
          path: bin\win64\zabbix_agent2.exe
